# Optional cloud alternative to the local launchd job (runs even when your Mac is off).
# Needs repo secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (and RESEND_API_KEY, ALERT_EMAIL_TO for email alerts).
# Note: Yahoo sometimes rate-limits GitHub's shared IPs; if ingest fails often, stick with the local job.
name: daily-refresh
on:
  schedule: [{ cron: "30 1 * * *" }] # 01:30 UTC
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run refresh
